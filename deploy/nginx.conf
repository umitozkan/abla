# Sertifika alındıktan sonra mevcut Nginx'inize ekleyin.
# deploy/nginx-http.conf ile aynı alan adı için iki ayrı dosya etkinleştirmeyin.
# APP_PORT farklıysa aşağıdaki proxy_pass portunu da güncelleyin.
server {
    listen 80;
    server_name abla.umitozkan.com.tr;

    # İlk kurulumla aynı webroot; otomatik sertifika yenilemesini destekler.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://abla.umitozkan.com.tr$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name abla.umitozkan.com.tr;

    ssl_certificate /etc/letsencrypt/live/abla.umitozkan.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abla.umitozkan.com.tr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EmineTLS:10m;
    ssl_session_timeout 1d;

    # Uygulama dosya başına 8 MB sınırı ayrıca uygular.
    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # İstemcinin gönderdiği başlığı eklemek yerine değiştirir.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
