# İlk sertifikayı almak için geçici yapılandırma.
# DNS A kaydı 207.180.223.77 olmalı; 80/TCP dışarıdan erişilebilir olmalı.
# Önce /var/www/letsencrypt dizinini oluşturun.
# certbot certonly --webroot -w /var/www/letsencrypt -d abla.umitozkan.com.tr
# Sertifika alınınca bu dosyanın yerine deploy/nginx.conf içeriğini kurun.
server {
    listen 80;
    server_name abla.umitozkan.com.tr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # HTTPS kurulmadan giriş ekranı ve uygulama HTTP üzerinden sunulmaz.
    location / {
        return 503;
    }
}
